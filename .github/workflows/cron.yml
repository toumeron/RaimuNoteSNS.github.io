name: 5-hour-news-refresh
on:
  schedule:
    # The server claims each source only when its last successful refresh is five hours old.
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-news-refresh
  cancel-in-progress: false

jobs:
  run-function:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and verify both news sources
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 240 -X POST "https://wrxaayteittkjoblgauk.supabase.co/functions/v1/generate-news" \
          -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
          -H "x-news-secret: $NEWS_CRON_SECRET" \
          -H "Content-Type: application/json" -d "{\"scheduled\":$SCHEDULED}" -o "$RUNNER_TEMP/news-result.json"
          python3 - "$RUNNER_TEMP/news-result.json" <<'PYTHON'
          import json, sys
          with open(sys.argv[1]) as response:
              results = json.load(response).get('results', [])
          for source in ('limenote', 'bluesky'):
              result = next((item for item in results if item.get('source') == source), None)
              if not result or result.get('error') or not (result.get('sourcePostsCount') or result.get('skipped')):
                  raise SystemExit(f"{source}: " + (result.get('error', 'No generated article') if result else 'Missing result'))
          print('Both sources generated or are not yet due for refresh')
          PYTHON
