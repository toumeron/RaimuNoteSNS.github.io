name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  prepare-recommendations:
    permissions:
      contents: write
    uses: ./.github/workflows/recommendation-catalog.yml
  build-and-deploy:
    needs: prepare-recommendations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
          # リロード対策(SPAのルーティング用)
          cp dist/index.html dist/404.html
        env:
          VITE_RECOMMENDATION_RANKER_ENABLED: ${{ vars.VITE_RECOMMENDATION_RANKER_ENABLED }}
          VITE_RECOMMENDATION_CATALOG_URL: https://raw.githubusercontent.com/toumeron/RaimuNoteSNS.github.io/generated/recommendations/catalog.json
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ vars.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_VIDEO_WORKER_URL: https://limenote-videos.megayont2.workers.dev

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
