<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LimeNote 視聴履歴の移行</title>
<style>
*{box-sizing:border-box}body{width:330px;margin:0;padding:24px;font:14px/1.8 system-ui,sans-serif;background:#111;color:#eee}h1{font-size:18px;margin:0 0 12px}p{font-size:12px;color:#aaa;margin:12px 0}button,a{font:inherit}button{width:100%;margin-top:10px;border:1px solid #444;border-radius:7px;background:#222;color:#eee;padding:10px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button.primary{background:#e8e8e8;color:#111;border:0}a{color:#bbb}#status{min-height:24px;font-size:12px}details{margin-top:18px;font-size:12px;color:#aaa}details button{font-size:12px;padding:6px}#count{color:#eee}ol{padding-left:18px}button:focus-visible,a:focus-visible{outline:2px solid #ddd;outline-offset:3px}
</style></head><body>
<h1>視聴履歴をLimeNoteへ</h1>
<p>配信サービスの視聴履歴・ウォッチリスト・マイリストから作品を読み取ります。</p>
<button id="collect" class="primary">このページの履歴を読み取る</button>
<button id="open-history" hidden>このサービスの視聴履歴を開く</button>
<p id="count" aria-live="polite">保存済み 0件</p>
<div id="status" role="status"></div>
<label style="display:block;margin-top:12px;font-size:12px;color:#aaa">移行先<select id="target" style="display:block;width:100%;padding:8px;margin-top:6px"><option value="https://toumeron.github.io/RaimuNoteSNS.github.io/watch-history">LimeNote</option><option value="http://localhost:8080/RaimuNoteSNS.github.io/watch-history">ローカル開発環境</option></select></label><button id="transfer" disabled>LimeNoteへ移行する</button>
<details><summary>使い方・保存データ</summary><ol><li>視聴履歴・ウォッチリスト・マイリストを開き、作品を読み取ります。</li><li>続きを表示して再度読み取ると重複を除いて追加します。</li><li>「LimeNoteへ移行する」を押し、移行先へのアクセスを許可します。</li><li>LimeNoteで作品の照合結果を確認して保存します。</li></ol><p>作品名・話数・確認できた視聴日時・作品URLをこの端末に保存します。Cookieや認証情報を取得しません。移行先では履歴が全体公開されます。</p><button id="clear">この端末の移行データを消す</button></details>
<script src="popup.mjs" type="module"></script></body></html>
